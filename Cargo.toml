[package]
name = "bevy_picking_bvh_backend"
version = "0.1.1"
edition = "2021"
authors = ["Romain Lamarche <lamarcheromain@gmail.com>"]
repository = "https://github.com/rlamarche/bevy_picking_bvh_backend"
license = "MIT"
description = "A picking backend plugin for Bevy which uses a BVH tree to improve performances."
resolver = "2"


[dependencies]
bevy_app = "0.16.1"
bevy_asset = "0.16.1"
bevy_animation = "0.16.1"
bevy_color = "0.16.1"
bevy_core_pipeline = "0.16.1"
bevy_derive = "0.16.1"
bevy_ecs = "0.16.1"
bevy_gizmos = "0.16.1"
bevy_gltf = "0.16.1"
bevy_input = "0.16.1"
bevy_internal = { version="0.16.1", features = [
  # "android-game-activity",
  # "android-game-activity",
  # "android_shared_stdcxx",
  "animation",
  "bevy_asset",
  # "bevy_audio",
  "bevy_color",
  "bevy_core_pipeline",
  # "bevy_gilrs",
  "bevy_gizmos",
  "bevy_gltf",
  # "bevy_mesh_picking_backend",
  "bevy_pbr",
  # "bevy_picking",
  "bevy_render",
  "bevy_scene",
  # "bevy_sprite",
  "bevy_sprite_picking_backend",
  "bevy_state",
  "bevy_text",
  "bevy_ui",
  # "bevy_ui_picking_backend",
  "bevy_window",
  "bevy_winit",
  # "custom_cursor",
  "default_font",
  "hdr",
  "multi_threaded",
  "png",
  "smaa_luts",
  # "sysinfo_plugin",
  "tonemapping_luts",
  # "vorbis",
  "webgl",
  "x11",
  "web"
]}
bevy_math  = { version = "0.16.1", features = ["bevy_reflect"] }
bevy_mesh = "0.16.1"
bevy_log = "0.16.1"
bevy_pbr = "0.16.1"
bevy_reflect = "0.16.1"
bevy_render = "0.16.1"
bevy_sprite = "0.16.1"
bevy_text = "0.16.1"
bevy_time = "0.16.1"
bevy_transform = "0.16.1"
bevy_tasks = "0.16.1"
bevy_scene = "0.16.1"
# bevy_ui = "0.16.1"
bevy_utils = "0.16.1"
bevy_window = "0.16.1"
bevy_platform = { version = "0.16.1", features = ["alloc", "serialize"] }
bevy_picking_more_hitinfo = { path = "../bevy_picking_more_hitinfo"}
#git ="https://github.com/nebumind-GmbH/bevy_picking_more_hitinfo.git" }

# Warn: this version does not work well with cube for example (for AABB with width/height/depth of 0 more generally)
bvh = { version = "0.10.0", optional = true }
futures-lite = "2.0.1"
nalgebra = { version = "0.33.2", optional = true }
crossbeam-channel = "0.5.14"
obvhs = { path = "../obvhs", features = ["parallel"], optional = true }
# obvhs = { version = "0.2.0", features = ["parallel"], optional = true }
uuid = { version = "1", features = ["v4"] }
web-time = { version = "1.1" }
web-sys = { version = "0.3.60" }

[dev-dependencies]
bevy_app = "0.16.1"
bevy_asset = "0.16.1"
bevy_animation = "0.16.1"
bevy_color = "0.16.1"
bevy_core_pipeline = "0.16.1"
bevy_derive = "0.16.1"
bevy_ecs = "0.16.1"
bevy_gizmos = "0.16.1"
bevy_input = "0.16.1"
bevy_internal = { version="0.16.1", features = [
  # "android-game-activity",
  # "android-game-activity",
  # "android_shared_stdcxx",
  "animation",
  "bevy_asset",
  # "bevy_audio",
  "bevy_color",
  "bevy_core_pipeline",
  # "bevy_gilrs",
  "bevy_gizmos",
  # "bevy_gltf",
  # "bevy_mesh_picking_backend",
  "bevy_pbr",
  # "bevy_picking",
  "bevy_render",
  "bevy_scene",
  # "bevy_sprite",
  "bevy_sprite_picking_backend",
  "bevy_state",
  "bevy_text",
  "bevy_ui",
  # "bevy_ui_picking_backend",
  "bevy_window",
  "bevy_winit",
  # "custom_cursor",
  "default_font",
  "hdr",
  "multi_threaded",
  "png",
  "smaa_luts",
  # "sysinfo_plugin",
  "tonemapping_luts",
  # "vorbis",
  "webgl",
  "x11",
  "web"
]}
bevy_math  = { version = "0.16.1", features = ["bevy_reflect"] }
bevy_mesh = "0.16.1"
bevy_log = "0.16.1"
bevy_pbr = "0.16.1"
bevy_reflect = "0.16.1"
bevy_render = "0.16.1"
bevy_sprite = "0.16.1"
bevy_tasks = "0.16.1"
bevy_text = "0.16.1"
bevy_time = "0.16.1"
bevy_transform = "0.16.1"
# bevy_ui = "0.16.1"
bevy_utils = "0.16.1"
bevy_window = "0.16.1"
bevy_platform = { version = "0.16.1", features = ["alloc", "serialize"] }

bevy_picking_more_hitinfo = { path = "../bevy_picking_more_hitinfo"}
bevy_panorbit_camera = "0.26"
rand = "0.8.0"
rand_chacha = "0.3.1"

web-time = { version = "1.1" }

[features]
default = ["obvhs"]
obvhs = ["dep:obvhs"]
bvh = ["dep:bvh", "dep:nalgebra"]
